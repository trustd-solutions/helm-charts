{{- if and (eq .Values.app.platform "ee") .Values.externalSecret.enabled -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: axonserver-secrets
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: axonserver-secrets
    creationPolicy: Owner
  data:
  - secretKey: axoniq.license
    remoteRef:
      key: {{ .Values.externalSecret.remoteRef.license }}
  - secretKey: axoniq.token
    remoteRef:
      key: {{ .Values.externalSecret.remoteRef.systemToken }}
  - secretKey: axonserver.properties
    remoteRef:
      key: {{ .Values.externalSecret.remoteRef.properties }}
  - secretKey: cluster-template.yaml
    remoteRef:
      key: {{ .Values.externalSecret.remoteRef.clusterTemplate }}
  {{- if .Values.externalSecret.remoteRef.logback }}
  - secretKey: logback.xml
    remoteRef:
      key: {{ .Values.externalSecret.remoteRef.logback }}
  {{- end }}
  {{- if .Values.externalSecret.remoteRef.recoveryFile }}
  - secretKey: recovery.json
    remoteRef:
      key: {{ .Values.externalSecret.remoteRef.recoveryFile }}
  {{- end }}
{{- end -}}
